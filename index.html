<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Grado</title>
<style>
:root{--bg:#0c0d10;--p1:#15171c;--p2:#1d2027;--p3:#272b34;--tx:#e8eaee;--mu:#8a909c;--ac:#ff8a4c;--ac2:#3fc7c0;--bd:#2b2f38;--r:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,select,input{font:inherit;color:inherit}
button{background:var(--p3);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;cursor:pointer}
button:active{filter:brightness(1.3)}
button.on{background:var(--ac);color:#111;border-color:var(--ac)}
button.pri{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
select{background:var(--p3);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--p1);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{font-size:16px;margin:0 6px 0 0;letter-spacing:.5px}
header h1 span{color:var(--ac)}
header .sp{flex:1}
main{flex:1;display:flex;min-height:0}
#left{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#stage{position:relative;flex:1;min-height:200px;background:#050506;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative;max-width:100%;max-height:100%;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#gl{max-width:100%;max-height:100%;display:block;touch-action:none}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--mu);text-align:center;padding:20px}
#empty b{font-size:18px;color:var(--tx)}
.ov{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.ov>*{pointer-events:auto;background:rgba(20,22,27,.8);backdrop-filter:blur(6px);font-size:12px;padding:5px 9px}
#splitLine{position:absolute;top:0;bottom:0;width:2px;background:#fff;display:none;pointer-events:none}
#player{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--p1);border-top:1px solid var(--bd)}
#player input[type=range]{flex:1}
#time{font-variant-numeric:tabular-nums;color:var(--mu);font-size:12px;min-width:84px;text-align:right}
#scopesBox{display:none;background:var(--p1);border-top:1px solid var(--bd);padding:6px 10px}
#scopesBox.show{display:block}
#scopesBox .bar{display:flex;gap:6px;margin-bottom:6px}
#scopesBox .bar button{padding:4px 9px;font-size:12px}
#scope{width:100%;max-width:520px;height:auto;background:#000;border-radius:6px;display:block}
#side{width:370px;max-width:100%;display:flex;flex-direction:column;background:var(--p1);border-left:1px solid var(--bd);min-height:0}
#tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--bd);flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{border:0;border-radius:0;background:none;color:var(--mu);padding:10px 12px;white-space:nowrap;border-bottom:2px solid transparent}
#tabs button.on{color:var(--tx);border-bottom-color:var(--ac);background:none}
#panels{flex:1;overflow-y:auto;padding:10px 12px 40px;-webkit-overflow-scrolling:touch}
.panel{display:none}.panel.on{display:block}
.sl{margin:7px 0 11px}
.sl .t{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin-bottom:2px}
.sl .t span:first-child{cursor:pointer}
.sl .t span:last-child{font-variant-numeric:tabular-nums;color:var(--tx)}
input[type=range]{width:100%;accent-color:var(--ac);margin:0;height:22px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:16px 0 6px;font-weight:600}
h3:first-child{margin-top:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;flex-direction:column;align-items:stretch;gap:3px;width:82px;padding:4px;font-size:11px;text-align:center;background:var(--p2)}
.chip canvas{width:100%;height:22px;border-radius:4px;display:block}
.chip.on{outline:2px solid var(--ac);background:var(--p3);color:var(--tx)}
.chip.txt{width:auto;padding:6px 10px;flex-direction:row}
.wheels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wheel{text-align:center;font-size:12px;color:var(--mu)}
.wheel canvas{width:100%;max-width:140px;aspect-ratio:1;touch-action:none;display:block;margin:4px auto}
#curveC{width:100%;max-width:300px;aspect-ratio:1;background:#0a0b0d;border-radius:8px;touch-action:none;display:block;margin:6px 0}
.note{color:var(--mu);font-size:12px;margin:6px 0}
.hue{height:8px;border-radius:4px;margin-bottom:-6px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.dot{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid transparent}
.dot.on{border-color:#fff}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;border:1px solid var(--bd);padding:8px 14px;border-radius:20px;z-index:9;display:none;max-width:90vw;text-align:center}
#prog{height:6px;background:var(--p3);border-radius:3px;overflow:hidden;margin:6px 0;display:none}
#prog i{display:block;height:100%;width:0;background:var(--ac)}
#nogl{padding:30px;display:none}
@media (max-width:820px){
  main{flex-direction:column}
  #side{width:100%;border-left:0;border-top:1px solid var(--bd);flex:none;height:46%}
  #stage{min-height:140px}
}
</style>
</head>
<body>
<div id="nogl">Il tuo browser non supporta WebGL: l'app non può funzionare.</div>
<div id="app">
<header>
  <h1>GRADO<span>.</span></h1>
  <button id="btnOpen" class="pri">Apri</button>
  <button id="btnUndo" title="Annulla">↶</button>
  <button id="btnRedo" title="Ripeti">↷</button>
  <button id="btnReset">Reset</button>
  <span class="sp"></span>
  <button id="btnScopes">Scope</button>
  <input id="fileIn" type="file" accept="video/*,image/*" multiple hidden>
</header>
<main>
  <section id="left">
    <div id="stage">
      <div id="wrap"><canvas id="gl"></canvas><div id="splitLine"></div></div>
      <div id="empty"><b>Apri un video o una foto</b><span>oppure trascinalo qui. Tutto resta sul tuo dispositivo.</span><button id="btnOpen2" class="pri">Scegli file</button></div>
      <div class="ov">
        <button id="btnHold">Tieni: originale</button>
        <button id="btnSplit">Dividi</button>
        <select id="viewSel"><option value="0">Vista normale</option><option value="1">Zebra</option><option value="2">Falsi colori</option></select>
      </div>
    </div>
    <div id="scopesBox"><div class="bar"><button data-sc="hist" class="on">Istogramma</button><button data-sc="wave">Forma d'onda</button><button data-sc="parade">Parade</button><button data-sc="vec">Vettorscopio</button></div><canvas id="scope" width="320" height="160"></canvas></div>
    <div id="player"><button id="playBtn">▶</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="time">0:00 / 0:00</span><button id="loopBtn">Loop</button></div>
  </section>
  <aside id="side">
    <nav id="tabs"></nav>
    <div id="panels"></div>
  </aside>
</main>
</div>
<div id="msg"></div>
<video id="vid" playsinline muted loop style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var clamp=function(x,a,b){return Math.min(b,Math.max(a,x))};
var canvas=$('#gl');
var gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:false,alpha:false})||canvas.getContext('experimental-webgl',{preserveDrawingBuffer:true,antialias:false,alpha:false});
if(!gl){$('#nogl').style.display='block';$('#app').style.display='none';return;}
var MAXTEX=gl.getParameter(gl.MAX_TEXTURE_SIZE)||4096;
var video=$('#vid');

/* ---------------- shader ---------------- */
var VS='attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.0,1.0);}';

var FS_MAIN=[
'precision highp float;varying vec2 vUv;',
'uniform sampler2D uSrc;uniform sampler2D uLut;uniform sampler2D uCurve;',
'uniform float uAspect,uBake,uBakeN,uCST,uExpIn,uTone;',
'uniform float uLutOn,uLutN,uLutAmt;uniform vec3 uDmin,uDmax;',
'uniform float uCA,uDist;uniform vec2 uWeave;',
'uniform float uExp,uCon,uHi,uSh,uWh,uBl,uTemp,uTint,uSat,uVib;',
'uniform vec3 uLift,uGamma,uGain,uOff;uniform vec4 uMix[8];',
'uniform float uFilmSat,uTech,uCurveOn,uSplitBal;uniform vec4 uSplitT;',
'uniform float uMaskType,uMaskInv,uMaskFeather,uMaskAng,uMaskPos,uMaskShow;uniform vec4 uMaskE;',
'uniform vec3 uMatchS,uMatchO;uniform float uMatchAmt;',
'float lum(vec3 c){return dot(c,vec3(0.2126,0.7152,0.0722));}',
'vec3 rgb2hsv(vec3 c){vec4 K=vec4(0.0,-1.0/3.0,2.0/3.0,-1.0);vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));float d=q.x-min(q.w,q.y);float e=1.0e-10;return vec3(abs(q.z+(q.w-q.y)/(6.0*d+e)),d/(q.x+e),q.x);}',
'vec3 hsv2rgb(vec3 c){vec4 K=vec4(1.0,2.0/3.0,1.0/3.0,3.0);vec3 p=abs(fract(c.xxx+K.xyz)*6.0-K.www);return c.z*mix(K.xxx,clamp(p-K.xxx,0.0,1.0),c.y);}',
'float dSlog3(float x){if(x>=0.167361){return pow(10.0,(x*1023.0-420.0)/261.5)*0.19-0.01;}return (x*1023.0-95.0)*0.01125/(171.2102946929-95.0);}',
'float dLogC(float t){if(t>0.149658){return (pow(10.0,(t-0.385537)/0.24719)-0.052272)/5.555556;}return (t-0.092809)/5.367655;}',
'float dVLog(float v){if(v<0.181){return (v-0.125)/5.6;}return pow(10.0,(v-0.598206)/0.241514)-0.00873;}',
'float dFLog(float t){if(t>=0.100537775){return pow(10.0,(t-0.790453)/0.344676)/0.555556-0.009468/0.555556;}return (t-0.092864)/8.735631;}',
'float dApple(float P){if(P>=0.2181){return exp2((P-0.69336945)/0.08550479)-exp2(-0.69336945/0.08550479)-0.05641088;}return sqrt(max((P-0.00964052)/47.28711236,0.0))-0.05641088;}',
'float dDI(float x){if(x<=0.02740668){return x/10.44426855;}return exp2(x/0.07329248-7.0)-0.0075;}',
'float shoulder(float v){float k=0.72;if(v<=k)return v;return k+(1.0-k)*(1.0-exp(-(v-k)/(1.0-k)));}',
'float oetf(float l){l=max(l,0.0);return l<=0.0031308?12.92*l:1.055*pow(l,1.0/2.4)-0.055;}',
'vec3 cstDecode(vec3 c){vec3 l;',
' if(uCST<1.5)l=vec3(dSlog3(c.r),dSlog3(c.g),dSlog3(c.b));',
' else if(uCST<2.5)l=vec3(dLogC(c.r),dLogC(c.g),dLogC(c.b));',
' else if(uCST<3.5)l=vec3(dVLog(c.r),dVLog(c.g),dVLog(c.b));',
' else if(uCST<4.5)l=vec3(dFLog(c.r),dFLog(c.g),dFLog(c.b));',
' else if(uCST<5.5)l=vec3(dApple(c.r),dApple(c.g),dApple(c.b));',
' else l=vec3(dDI(c.r),dDI(c.g),dDI(c.b));',
' l=max(l,0.0)*exp2(uExpIn);',
' if(uTone>0.5)l=vec3(shoulder(l.r),shoulder(l.g),shoulder(l.b));',
' return vec3(oetf(l.r),oetf(l.g),oetf(l.b));}',
'vec3 lutTex(float r,float g,float b){float N=uLutN;return texture2D(uLut,vec2((b*N+r+0.5)/(N*N),(g+0.5)/N)).rgb;}',
'vec3 lutSample(vec3 c){float N=uLutN;c=clamp(c,0.0,1.0)*(N-1.0);vec3 f=floor(c);vec3 t=c-f;vec3 g=min(f+1.0,vec3(N-1.0));',
' vec3 c000=lutTex(f.r,f.g,f.b);vec3 c100=lutTex(g.r,f.g,f.b);vec3 c010=lutTex(f.r,g.g,f.b);vec3 c110=lutTex(g.r,g.g,f.b);',
' vec3 c001=lutTex(f.r,f.g,g.b);vec3 c101=lutTex(g.r,f.g,g.b);vec3 c011=lutTex(f.r,g.g,g.b);vec3 c111=lutTex(g.r,g.g,g.b);',
' vec3 a=mix(mix(c000,c100,t.r),mix(c010,c110,t.r),t.g);vec3 b=mix(mix(c001,c101,t.r),mix(c011,c111,t.r),t.g);return mix(a,b,t.b);}',
'vec4 cl(float x){return texture2D(uCurve,vec2(clamp(x,0.0,1.0)*(255.0/256.0)+0.5/256.0,0.5));}',
'vec3 grade(vec3 c){',
' c=pow(max(c,0.0),vec3(2.2))*exp2(uExp);c=pow(c,vec3(1.0/2.2));',
' c.r*=1.0+0.25*uTemp;c.b*=1.0-0.25*uTemp;c.g*=1.0-0.2*uTint;c.r*=1.0+0.08*uTint;c.b*=1.0+0.08*uTint;',
' float bk=-uBl*0.1;float wh=1.0-uWh*0.2;c=(c-bk)/(wh-bk);',
' float l=clamp(lum(c),0.0,1.0);',
' c+=uSh*0.3*pow(1.0-l,3.0);c+=uHi*0.25*pow(l,3.0);',
' float k=uCon>=0.0?1.0+uCon*1.2:1.0+uCon*0.8;c=(c-0.5)*k+0.5;',
' l=lum(c);c=mix(vec3(l),c,1.0+uSat);',
' float mx=max(c.r,max(c.g,c.b));float mn=min(c.r,min(c.g,c.b));c=mix(vec3(l),c,1.0+uVib*(1.0-(mx-mn)));',
' c=max(c,0.0);',
' c=c+uLift*(1.0-c);c=pow(max(c,0.0),1.0/max(vec3(1.0)+uGamma,vec3(0.15)));c=c*(vec3(1.0)+uGain);c=c+uOff;c=max(c,0.0);',
' vec3 hsv=rgb2hsv(clamp(c,0.0,1.0));float h=hsv.x*360.0;vec3 adj=vec3(0.0);',
' for(int i=0;i<8;i++){float dh=abs(h-uMix[i].x);dh=min(dh,360.0-dh);float w=max(0.0,1.0-dh/45.0)*smoothstep(0.02,0.2,hsv.y);adj+=w*uMix[i].yzw;}',
' hsv.x=fract(hsv.x+adj.x*30.0/360.0);hsv.y=clamp(hsv.y*(1.0+adj.y),0.0,1.0);c=hsv2rgb(hsv)*(1.0+adj.z*0.6)+(c-clamp(c,0.0,1.0));',
' if(uSplitT.y>0.0||uSplitT.w>0.0){vec3 s1=hsv2rgb(vec3(uSplitT.x,1.0,1.0));s1-=lum(s1);vec3 s2=hsv2rgb(vec3(uSplitT.z,1.0,1.0));s2-=lum(s2);float t=smoothstep(0.0,1.0,clamp(lum(c)+uSplitBal*0.3,0.0,1.0));c+=s1*uSplitT.y*0.3*(1.0-t)+s2*uSplitT.w*0.3*t;}',
' if(uTech>0.0){vec3 t=vec3(c.r*1.18-c.g*0.1-c.b*0.06,c.g*1.1-c.r*0.05-c.b*0.06,c.b*1.12-c.g*0.12-c.r*0.02);float lt=lum(t);t=mix(vec3(lt),t,1.25);t=(t-0.5)*1.08+0.5;c=mix(c,t,uTech);}',
' if(uFilmSat!=0.0){float ll=lum(c);float resp=1.0-pow(abs(2.0*clamp(ll,0.0,1.0)-1.0),2.0);c=mix(vec3(ll),c,1.0+uFilmSat*(0.2+0.8*resp));}',
' if(uCurveOn>0.5){c=clamp(c,0.0,1.0);vec3 m=vec3(cl(c.r).a,cl(c.g).a,cl(c.b).a);c=vec3(cl(m.r).r,cl(m.g).g,cl(m.b).b);}',
' return c;}',
'void main(){vec3 c;',
' if(uBake>0.5){float N=uBakeN;float i=floor(vUv.x*N*N);c=vec3(mod(i,N),floor(vUv.y*N),floor(i/N))/(N-1.0);}',
' else{vec2 uv=vUv;vec2 p=(uv-0.5)*vec2(uAspect,1.0);float r2=dot(p,p);p*=1.0+uDist*r2;uv=p/vec2(uAspect,1.0)+0.5+uWeave;',
'  vec2 d=(uv-0.5)*uCA*0.03;c=vec3(texture2D(uSrc,uv+d).r,texture2D(uSrc,uv).g,texture2D(uSrc,uv-d).b);}',
' if(uCST>0.5)c=cstDecode(c);',
' vec3 base=c;',
' if(uLutOn>0.5){vec3 l=lutSample((c-uDmin)/(uDmax-uDmin));c=mix(c,l,uLutAmt);}',
' c=grade(c);',
' if(uMatchAmt>0.0){c=mix(c,c*uMatchS+uMatchO,uMatchAmt);}',
' float m=1.0;',
' if(uBake<0.5){',
'  if(uMaskType>0.5&&uMaskType<1.5){vec2 q=(vUv-0.5)*vec2(uAspect,1.0);vec2 dir=vec2(cos(uMaskAng),sin(uMaskAng));float d=dot(q,dir)-uMaskPos;m=smoothstep(-uMaskFeather,uMaskFeather,d);}',
'  else if(uMaskType>1.5){vec2 q=(vUv-uMaskE.xy)*vec2(uAspect,1.0);q/=uMaskE.zw;float d=length(q);m=1.0-smoothstep(1.0-uMaskFeather,1.0+uMaskFeather,d);}',
'  if(uMaskType>0.5&&uMaskInv>0.5)m=1.0-m;}',
' c=mix(base,c,m);',
' if(uMaskShow>0.5&&uMaskType>0.5)c=mix(c,vec3(1.0,0.1,0.2),0.5*(1.0-m));',
' gl_FragColor=vec4(clamp(c,0.0,1.0),1.0);}'
].join('\n');

var FS_DOWN=[
'precision highp float;varying vec2 vUv;uniform sampler2D uT;uniform vec2 uDst;',
'void main(){vec3 s=vec3(0.0);for(int i=0;i<4;i++){for(int j=0;j<4;j++){vec2 o=(vec2(float(i),float(j))-1.5)*0.25*uDst;s+=texture2D(uT,vUv+o).rgb;}}gl_FragColor=vec4(s/16.0,1.0);}'
].join('\n');

var FS_BLUR=[
'precision highp float;varying vec2 vUv;uniform sampler2D uT;uniform vec2 uDir;',
'void main(){vec3 s=texture2D(uT,vUv).rgb*0.2270270;',
' s+=(texture2D(uT,vUv+uDir*1.3846).rgb+texture2D(uT,vUv-uDir*1.3846).rgb)*0.3162162;',
' s+=(texture2D(uT,vUv+uDir*3.2308).rgb+texture2D(uT,vUv-uDir*3.2308).rgb)*0.0702703;gl_FragColor=vec4(s,1.0);}'
].join('\n');

var FS_FINAL=[
'precision highp float;varying vec2 vUv;uniform sampler2D uG;uniform sampler2D uBlur;uniform sampler2D uSrc;',
'uniform vec2 uRes;uniform float uAspect,uTime,uGrain,uGrainSize,uGrainColor,uHal,uHalThr,uBloom,uBloomThr,uDiff,uClar,uVig,uVigSize,uView,uSplit;',
'float lum(vec3 c){return dot(c,vec3(0.2126,0.7152,0.0722));}',
'float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}',
'void main(){',
' if(vUv.x<uSplit){gl_FragColor=vec4(texture2D(uSrc,vUv).rgb,1.0);if(abs(vUv.x-uSplit)<0.0);return;}',
' vec3 c=texture2D(uG,vUv).rgb;vec3 bl=texture2D(uBlur,vUv).rgb;',
' if(uClar!=0.0){c+=(c-bl)*uClar*0.8;}',
' if(uDiff>0.0){c=mix(c,max(c,bl),uDiff*0.6);c=mix(c,bl,uDiff*0.25);}',
' float hl=lum(bl);',

function saveLook(){var n=prompt('Nome del look?');if(!n)return;var a=savedLooks();a.push({name:n,data:lookData()});try{localStorage.setItem('grado_looks',JSON.stringify(a));}catch(e){msg('Impossibile salvare');return;}renderLooks();msg('Look salvato');}
function renderLooks(){var c=window.__looks;c.innerHTML='';var a=savedLooks();if(!a.length){c.appendChild(el('div','note','Nessun look salvato. Usa Esporta → Salva look.'));return;}
 a.forEach(function(l,i){var b=el('button','chip txt',l.name);b.onclick=function(){applyLook(l.data)};b.oncontextmenu=function(e){e.preventDefault();if(confirm('Eliminare "'+l.name+'"?')){a.splice(i,1);localStorage.setItem('grado_looks',JSON.stringify(a));renderLooks();}};var d=el('button','chip txt','✕');d.title='Elimina';d.onclick=function(){if(confirm('Eliminare "'+l.name+'"?')){a.splice(i,1);localStorage.setItem('grado_looks',JSON.stringify(a));renderLooks();}};var w=el('div','row');w.style.margin='0';w.appendChild(b);w.appendChild(d);c.appendChild(w);});}

 setSize(16,9);pushHist();refreshUI();window.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.code==='Space'&&src&&src.type==='video'){e.preventDefault();$('#playBtn').click();}if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();(e.shiftKey?$('#btnRedo'):$('#btnUndo')).click();}});})();
